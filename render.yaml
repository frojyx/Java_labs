databases:
  - name: restaurant-db
    databaseName: restaurant_db
    user: restaurant_user
    plan: free
    region: frankfurt

services:
  - name: restaurant-backend
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://dpg-d7t5s51j2pic73ajeps0-a/restaurant_db_yzl2
      - key: SPRING_DATASOURCE_USERNAME
        value: restaurant_user
      - key: SPRING_DATASOURCE_PASSWORD
        value: g4XkQ5rd8b8f1V0555Obmien3Jol4IBV
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: SPRING_JPA_FORMAT_SQL
        value: "false"
      - key: APP_CORS_ALLOWED_ORIGIN
        value: https://restaurant-frontend.onrender.com

  - name: restaurant-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://restaurant-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
