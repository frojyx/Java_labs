databases:
  - name: restaurant-db
    databaseName: restaurant_db
    user: restaurant_user
    plan: free
    region: frankfurt

services:
  - name: restaurant-backend
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: restaurant-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: restaurant-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: SPRING_JPA_FORMAT_SQL
        value: "false"

  - name: restaurant-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://REPLACE_WITH_RENDER_BACKEND_URL/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
