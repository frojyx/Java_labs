name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build-test:
    name: Backend build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build + lint + tests
        run: ./mvnw -B clean verify

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.sources=src/main/java/com/example/demo/service \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.inclusions=**/*.java

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  deploy-render-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs:
      - backend-build-test
      - frontend-build
    if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master') && secrets.RENDER_API_KEY != '' && secrets.RENDER_BACKEND_SERVICE_ID != '' }}
    permissions:
      contents: read

    steps:
      - name: Trigger backend deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_BACKEND_SERVICE_ID}/deploys" \
            --header "accept: application/json" \
            --header "authorization: Bearer ${RENDER_API_KEY}" \
            --header "content-type: application/json" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${COMMIT_SHA}\"}"

  backend-healthcheck:
    name: Backend healthcheck
    runs-on: ubuntu-latest
    needs: deploy-render-backend
    if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master') && secrets.RENDER_BACKEND_HEALTHCHECK_URL != '' }}
    permissions:
      contents: read

    steps:
      - name: Wait for backend healthcheck
        env:
          HEALTHCHECK_URL: ${{ secrets.RENDER_BACKEND_HEALTHCHECK_URL }}
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error "$HEALTHCHECK_URL"; then
              exit 0
            fi
            echo "Backend not ready yet, retry $i/30"
            sleep 20
          done
          echo "Backend healthcheck failed: $HEALTHCHECK_URL"
          exit 1

  deploy-render-frontend:
    name: Deploy frontend to Render
    runs-on: ubuntu-latest
    needs: backend-healthcheck
    if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master') && secrets.RENDER_API_KEY != '' && secrets.RENDER_FRONTEND_SERVICE_ID != '' }}
    permissions:
      contents: read

    steps:
      - name: Trigger frontend deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_FRONTEND_SERVICE_ID}/deploys" \
            --header "accept: application/json" \
            --header "authorization: Bearer ${RENDER_API_KEY}" \
            --header "content-type: application/json" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${COMMIT_SHA}\"}"

  frontend-healthcheck:
    name: Frontend healthcheck
    runs-on: ubuntu-latest
    needs: deploy-render-frontend
    if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master') && secrets.RENDER_FRONTEND_URL != '' }}
    permissions:
      contents: read

    steps:
      - name: Wait for frontend
        env:
          FRONTEND_URL: ${{ secrets.RENDER_FRONTEND_URL }}
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error "$FRONTEND_URL"; then
              exit 0
            fi
            echo "Frontend not ready yet, retry $i/30"
            sleep 20
          done
          echo "Frontend healthcheck failed: $FRONTEND_URL"
          exit 1
