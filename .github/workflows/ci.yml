name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/restaurant-backend

jobs:
  backend-test:
    name: Backend build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build + lint + tests + JaCoCo
        run: ./mvnw -B clean verify

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.sources=src/main/java/com/example/demo/service \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.inclusions=**/*.java

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  docker-image:
    name: Build and publish backend image
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-backend:
    name: Deploy backend and run healthcheck
    runs-on: ubuntu-latest
    needs: docker-image
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') && secrets.KOYEB_TOKEN != '' && secrets.KOYEB_APP_NAME != '' && secrets.KOYEB_SERVICE_NAME != '' && secrets.KOYEB_HEALTHCHECK_URL != '' }}
    permissions:
      contents: read

    steps:
      - name: Install Koyeb CLI
        run: curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh

      - name: Add Koyeb CLI to PATH
        run: echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Redeploy service
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_APP_NAME: ${{ secrets.KOYEB_APP_NAME }}
          KOYEB_SERVICE_NAME: ${{ secrets.KOYEB_SERVICE_NAME }}
        run: koyeb services redeploy "${KOYEB_APP_NAME}/${KOYEB_SERVICE_NAME}" --token "${KOYEB_TOKEN}" --wait

      - name: Healthcheck
        env:
          HEALTHCHECK_URL: ${{ secrets.KOYEB_HEALTHCHECK_URL }}
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error "$HEALTHCHECK_URL"; then
              exit 0
            fi
            sleep 15
          done
          echo "Healthcheck failed for $HEALTHCHECK_URL"
          exit 1
